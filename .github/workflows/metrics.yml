# Professional GitHub metrics dashboard via lowlighter/metrics
# Generates: contribution calendar (heatmap + isometric), coding habits, activity, issues/PRs
# See https://github.com/lowlighter/metrics
name: Metrics (lowlighter)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/metrics.yml'
      - 'README.md'

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # --- Dashboard: calendar heatmap + isometric + issues/PRs only (no habits/activity to avoid API errors) ---
      - name: Generate metrics dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/metrics.svg
          base: ""
          config_order: calendar, isocalendar, followup
          config_timezone: Europe/London
          # 📆 Commit calendar (flat heatmap, current year)
          plugin_calendar: yes
          plugin_calendar_limit: 1
          # 📅 Isometric contribution calendar (half-year)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          # 🎟️ Issues & pull requests
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          # Explicitly off so they never run (they cause "Unexpected error" with GITHUB_TOKEN)
          plugin_habits: "no"
          plugin_activity: "no"
