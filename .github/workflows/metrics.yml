# Professional GitHub metrics dashboard via lowlighter/metrics
# Generates: contribution calendar (heatmap + isometric), coding habits, activity, issues/PRs
# See https://github.com/lowlighter/metrics
name: Metrics (lowlighter)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/metrics.yml'
      - 'README.md'

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # --- Dashboard: calendar heatmap + isometric calendar + issues/PRs (habits/activity disabled: need PAT to avoid "Unexpected error") ---
      - name: Generate metrics dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/metrics.svg
          base: ""
          config_order: calendar, isocalendar, followup
          config_timezone: Europe/London
          # 📆 Commit calendar (flat heatmap, current year)
          plugin_calendar: yes
          plugin_calendar_limit: 1
          # 📅 Isometric contribution calendar (half-year)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          # 🎟️ Issues & pull requests overview
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          # 💡 Habits & 📰 Activity disabled: they often hit API limits with GITHUB_TOKEN.
          # Re-enable with token: ${{ secrets.METRICS_TOKEN }} (PAT) and add habits, activity to config_order.
